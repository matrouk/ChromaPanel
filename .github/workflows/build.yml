name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # csc.exe ships with the .NET Framework already on the runner,
      # so there is nothing to set up.
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Tools -Test

      - name: Show output
        shell: pwsh
        run: Get-ChildItem build | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaPanel
          path: |
            build/ChromaPanel.exe
            build/DumpDisplays.exe
          if-no-files-found: error

      # Tagging v* publishes a release with the exe attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            build/ChromaPanel.exe
            build/DumpDisplays.exe
